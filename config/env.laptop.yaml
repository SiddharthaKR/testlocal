# Laptop setup (Windows, Git Bash, Ollama). To use: cp config/env.laptop.yaml config/env.yaml
upstream_url: http://localhost:11434/v1     # Phase 2: LM Studio URL
model: gemma4-e4b-ctx65536:latest          # Phase 2: LM Studio model id  (laptop 32k variant: gemma4-e4b-ctx32768:latest)
proxy_port: 8100
pyrpl_repo: ./vendor/pyrpl                 # read-only vendor copy; never edit
pyrpl_commit: 7b0ac7a037a0d71f994fef42749176c8c596e186   # tag demo-baseline
pyrpl_rtl: pyrpl/fpga/rtl                  # Verilog location inside pyrpl_repo
workspace_dir: ../fpga_agent_ws             # agent workspace, OUTSIDE this repo (no path to harness/)
fpga_part: xc7z010clg400-1                 # Red Pitaya Z10 (xc7z020clg400-1 for Z20)
clk_period_ns: 8.0
vivado: auto                               # auto | /path/to/vivado | none
python_cmd: py                             # laptop: py | server: python3
iverilog_dir: /c/iverilog/bin              # auto (use PATH) | dir holding iverilog+vvp
context_limit: 65536                       # model context window (tokens), must match the model
agent_timeout_min: 40                      # agent wall-clock limit per run
