# Office server (.126): LM Studio + Gemma 4 26B-A4B. Fill in every TODO (see PORTING.md).
upstream_url: http://TODO-LMSTUDIO-HOST:1234/v1   # TODO: LM Studio OpenAI-compatible endpoint
model: TODO-gemma-4-26b-a4b-model-id              # TODO: exact id from `curl <upstream_url>/models`
